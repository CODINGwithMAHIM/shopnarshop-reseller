var REVIEW_MS=25*60*1000,SHARE=0.8,MIN_WD=100,KEY='shopnar_reseller_v1';
var mem=null,D=load(),tab='login',view='home',timer=null;
function init(){return{users:{},products:[],wd:[],me:null}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):init()}catch(e){return init()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('ছবি বেশি বড়, সেভ করা যায়নি')}}
function $(s){return document.querySelector(s)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2600)}
function tk(n){return '৳'+Math.round(n).toLocaleString('en-US')}
function status(p){return Date.now()-p.created>=REVIEW_MS?'ok':'wait'}
function mine(){return D.products.filter(function(p){return p.owner===D.me})}
function earned(){return mine().reduce(function(s,p){return s+(p.sold||0)*(p.sell-p.buy)*SHARE},0)}
function withdrawn(){return D.wd.filter(function(w){return w.owner===D.me}).reduce(function(s,w){return s+w.amt},0)}
function balance(){return earned()-withdrawn()}
function render(){clearInterval(timer);D.me&&D.users[D.me]?dash():home();
 if(D.me&&mine().some(function(p){return status(p)==='wait'}))timer=setInterval(render,30000)}
function home(){
 var f=tab==='login'

async function loadAll(){
 var s=(await SB.auth.getSession()).data.session;if(!s){D=init();return false}
 var uid=s.user.id;
 var r=await Promise.all([
  SB.from('profiles').select('*').eq('id',uid).single(),
  SB.from('products').select('*').eq('owner',uid).order('created_at',{ascending:false}),
  SB.from('withdrawals').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
  SB.from('sales').select('reseller_amount'),
  SB.rpc('my_balance')]);
 var pr=r[0].data;if(!pr)return false;
 ADMIN=pr.role==='admin';
 var prods=r[1].data||[],urls={},paths=prods.map(function(p){return p.image_path});
 if(paths.length){var su=await SB.storage.from('product-images').createSignedUrls(paths,3600);(su.data||[]).forEach(function(x){urls[x.path]=x.signedUrl})}
 D.me='me';D.users.me={name:pr.name,phone:pr.phone,address:pr.address,bk:pr.bkash_number||''};
 D.products=prods.map(function(p){return{id:p.id,owner:'me',img:urls[p.image_path]||'',path:p.image_path,cap:p.caption,buy:+p.buy_price,sell:+p.sell_price,sold:p.sold_count,st:p.status,code:p.code,why:p.reject_reason}});
 D.wd=(r[2].data||[]).map(function(w){return{amt:+w.amount,bk:w.bkash_number,date:Date.parse(w.created_at),st:w.status}});
 E=(r[3].data||[]).reduce(function(s,x){return s+ +x.reseller_amount},0);
 W=D.wd.filter(function(w){return w.st!=='rejected'}).reduce(function(s,w){return s+w.amt},0);
 B=+(r[4].data||0);return true}
